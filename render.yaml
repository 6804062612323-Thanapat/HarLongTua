# ตั้งค่า Deploy บน Render ค่าลับกรอกในหน้าเว็บ Render ไม่เก็บในไฟล์นี้
services:
  - type: web
    name: harlongtua
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
